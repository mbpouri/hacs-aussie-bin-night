name: Bug report
description: Report a problem with Aussie Bin Night.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include your full home address, API key, or other credentials.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove addresses, identifiers, and credentials before posting.
    validations:
      required: false
