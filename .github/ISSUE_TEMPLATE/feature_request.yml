name: Feature request
description: Suggest an improvement or a new capability for Aussie Bin Night.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not include your full home address or other personal details.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation first, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Automations, templates or cards you use as a workaround.
    validations:
      required: false
