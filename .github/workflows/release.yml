name: Release

# Run manually from the Actions tab once the version bump and changelog are on main
# and CI is green. It tags the current head of main and publishes the GitHub release,
# with notes taken from the matching CHANGELOG.md section.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (must match manifest.json and CHANGELOG.md)"
        required: true
        type: string

# Setting any permission resets the rest to none, so list everything the jobs need:
# contents to tag and publish, checks to confirm CI passed.
permissions:
  contents: write
  checks: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Check the version is ready to release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          manifest_version=$(jq -r .version custom_components/aussie_bin_night/manifest.json)
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::manifest.json says $manifest_version, not $VERSION. Bump it and merge to main first."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Add one and merge to main first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every other check on this commit must have succeeded; this job's own check is still running.
          not_passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate \
            --jq '.check_runs[] | select(.name != "release") | select(.conclusion != "success") | "\(.name): \(.status)/\(.conclusion)"')
          total=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.total_count')
          if [ "$total" -lt 2 ]; then
            echo "::error::No CI checks found for $GITHUB_SHA. Wait for them to start."
            exit 1
          fi
          if [ -n "$not_passed" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA:"
            echo "$not_passed"
            exit 1
          fi

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::The CHANGELOG.md section for $VERSION is empty."
            exit 1
          fi
          {
            echo
            echo "Full details in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest
